name: Build & verify sitemaps on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verify package-lock.json is in sync with package.json
        run: |
          set -e
          mkdir -p /tmp/ci-report
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json missing" | tee /tmp/ci-report/lockfile.txt
            exit 1
          fi
          # `npm ci --dry-run` fails fast if lockfile is inconsistent with package.json
          if npm ci --dry-run --no-audit --no-fund > /tmp/ci-report/lockfile.txt 2>&1; then
            echo "✅ package-lock.json consistent with package.json" | tee -a /tmp/ci-report/lockfile.txt
          else
            echo "❌ package-lock.json out of sync with package.json — run 'npm install' locally and commit the updated lockfile." | tee -a /tmp/ci-report/lockfile.txt
            exit 1
          fi

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund 2>&1 | tee /tmp/ci-report/install.log

      - name: Build full PDF index (resumable)
        run: node scripts/build-pdf-index.mjs 2>&1 | tee /tmp/ci-report/pdf-index.log

      - name: Run validator tests
        run: npx vitest run --reporter=verbose 2>&1 | tee /tmp/ci-report/vitest.log

      - name: Enforce canonical URLs
        run: node scripts/enforce-canonical.mjs .

      - name: SEO validation — canonical/hreflang/OpenGraph/Twitter per language
        run: |
          set -e
          node scripts/build-ubi-page.mjs 2>&1 | tee /tmp/ci-report/ubi-build.log
          node scripts/seo-validate.mjs 2>&1 | tee /tmp/ci-report/seo-validation.log
          cp data/seo-validation.md /tmp/ci-report/ 2>/dev/null || true
          cp data/seo-validation.json /tmp/ci-report/ 2>/dev/null || true

      - name: Regression — search/xref/sitemap integrity
        run: |
          set -e
          fail=0
          echo "## Regression checks" | tee /tmp/ci-report/regression.log
          # 1. sitemap.xml exists
          [ -f sitemap.xml ] || { echo "❌ sitemap.xml missing"; fail=1; }
          [ -f robots.txt ] || { echo "❌ robots.txt missing"; fail=1; }
          [ -f llms.txt ] || { echo "❌ llms.txt missing"; fail=1; }
          # 2. PDF search indices loadable + non-empty
          for f in data/search_*.json; do
            [ -f "$f" ] || continue
            node -e "const a=JSON.parse(require('fs').readFileSync('$f','utf8'));const n=Array.isArray(a)?a.length:(a.docs?a.docs.length:Object.keys(a).length);if(!n){process.exit(2)}" \
              || { echo "❌ empty/broken: $f"; fail=1; }
          done
          # 3. xref.json loadable
          if [ -f data/xref.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('data/xref.json','utf8'))" \
              || { echo "❌ broken data/xref.json"; fail=1; }
          fi
          # 4. search-index.json loadable when present
          if [ -f data/search-index.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('data/search-index.json','utf8'))" \
              || { echo "❌ broken data/search-index.json"; fail=1; }
          fi
          if [ "$fail" = "0" ]; then echo "✅ regression checks passed"; fi
          exit $fail
        # Surface log to artifact
        continue-on-error: false

      - name: Verify sitemap.xml is reachable on Pages
        env:
          BASE: https://et-pioneer.github.io/electric-navigator
        run: |
          set -e
          fail=0
          echo "Checking $BASE/sitemap.xml"
          code=$(curl -sS -o /tmp/sm.xml -w "%{http_code}" "$BASE/sitemap.xml" || echo 000)
          if [ "$code" != "200" ]; then echo "❌ sitemap.xml HTTP $code"; fail=1; else echo "✅ sitemap.xml 200"; fi

          # Extract every <loc> and HEAD-check
          grep -oE 'https?://[^<]+' /tmp/sm.xml | sort -u > /tmp/locs.txt
          total=$(wc -l < /tmp/locs.txt)
          echo "Verifying $total URLs from sitemap.xml…"
          while read -r u; do
            c=$(curl -sS -o /dev/null -w "%{http_code}" -L "$u" || echo 000)
            if [ "$c" != "200" ]; then echo "  ❌ $c $u"; fail=1; else echo "  ✅ $u"; fi
          done < /tmp/locs.txt

          # Per-language sitemap files
          for f in sitemaps/sitemap-*.xml; do
            name=$(basename "$f")
            c=$(curl -sS -o /dev/null -w "%{http_code}" -L "$BASE/sitemaps/$name" || echo 000)
            if [ "$c" != "200" ]; then echo "❌ $c sitemaps/$name"; fail=1; else echo "✅ sitemaps/$name"; fi
          done

          exit $fail

      - name: Assemble build/test report
        if: always()
        run: |
          mkdir -p /tmp/ci-report
          {
            echo "# CI Build/Test Report"
            echo "Commit: ${GITHUB_SHA}"
            echo "Ref:    ${GITHUB_REF}"
            echo "Run:    ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "Date:   $(date -u +%FT%TZ)"
            echo ""
            echo "## Lockfile check"
            tail -n 20 /tmp/ci-report/lockfile.txt 2>/dev/null || echo "(no log)"
            echo ""
            echo "## npm install (tail)"
            tail -n 40 /tmp/ci-report/install.log 2>/dev/null || echo "(no log)"
            echo ""
            echo "## PDF index per-language stats"
            if [ -d data ]; then
              for f in data/search_*.json; do
                [ -f "$f" ] || continue
                lang=$(basename "$f" .json | sed 's/^search_//')
                count=$(node -e "try{const a=JSON.parse(require('fs').readFileSync('$f','utf8'));console.log(Array.isArray(a)?a.length:(a.docs?a.docs.length:Object.keys(a).length))}catch(e){console.log('ERR')}")
                printf '  %-6s %s entries\n' "$lang" "$count"
              done
            fi
            echo ""
            echo "## Vitest summary (tail)"
            tail -n 80 /tmp/ci-report/vitest.log 2>/dev/null || echo "(no log)"
            echo ""
            echo "## Retry report (if present)"
            [ -f data/retry-report.json ] && head -n 200 data/retry-report.json || echo "(none)"
          } > /tmp/ci-report/report.md
          echo "----- REPORT -----"
          cat /tmp/ci-report/report.md
          # Also surface in the GitHub Actions step summary UI
          cat /tmp/ci-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build/test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-test-report
          path: /tmp/ci-report/
          if-no-files-found: warn

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-verify-log
          path: /tmp/locs.txt
          if-no-files-found: ignore