name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verify lockfile in sync
        run: npm ci --dry-run --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build PDF search index
        run: node scripts/build-pdf-index.mjs || echo "index step soft-failed (will use existing data/)"

      - name: Enforce canonical URLs
        run: node scripts/enforce-canonical.mjs .

      - name: Build sitemap.xml
        env:
          SITEMAP_BASE_URL: https://et-navigator.lovable.app
        run: |
          node scripts/build-sitemap.mjs
          test -s sitemap.xml
          grep -q '<loc>' sitemap.xml

      - name: Assemble static site for Pages
        run: |
          set -e
          mkdir -p _site
          # Copy every static HTML, asset, data and sitemap file at repo root
          # GitHub Pages is fully static; no runtime deps.
          rsync -a \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='scripts' \
            --exclude='.workspace' \
            --exclude='*.lockb' \
            --exclude='package*.json' \
            --exclude='tsconfig*.json' \
            --exclude='vite*.config.*' \
            --exclude='postcss.config.*' \
            --exclude='tailwind.config.*' \
            --exclude='eslint.config.*' \
            --exclude='components.json' \
            ./ _site/
          # Sanity: required files present (HTML entry, sitemap, hero/logo images, CSS)
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/assets/css/style.css
          test -f _site/assets/img/et-logo.jpg
          test -f _site/assets/img/hero-logo.jpg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4